<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){var t=localStorage.getItem('rides_theme')||'classic';document.documentElement.setAttribute('data-theme',t);})()</script>
  <title>8 Second Rides — My Rides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/rider-glass.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#00203f" />
</head>
<body class="theme-glass">
<div class="shell">
  <nav class="topnav">
    <div class="topnav-brand">
      <div class="brand-word"><b>8 SECOND</b><span>Rides</span></div>
    </div>
    <div class="topnav-links"></div>
    <div class="topnav-user">
      <div class="avatar" id="user-avatar"><i class="fa-solid fa-user"></i></div>
      <div class="user-meta"><div class="user-name" id="user-name">Loading…</div><div class="user-role-label">My Rides</div></div>
      <button class="btn btn-sm" onclick="signOut()" style="margin-left:8px"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </nav>
  <div class="content">
    <div class="topbar">
      <div><div><div class="page-title" id="page-title">My Rides</div><div class="page-sub" id="page-sub">Request and track your rides</div></div></div>
    </div>
    <div class="main-panel">
<div id="sec-live" class="section-title"><i class="fa-solid fa-tower-broadcast"></i> Live now</div>
<div id="live"></div>
<div id="request-card" class="card" style="margin:18px 0 22px">
  <div class="section-title"><i class="fa-solid fa-plus"></i> Request a ride</div>
  <form onsubmit="submitRequest(event)">
    <div class="form-row">
      <div class="form-group"><label class="form-label">Pickup</label>
        <select class="form-input" name="pickup"></select>
        <input class="form-input" name="pickup_text" placeholder="…or start typing an address" style="margin-top:6px" autocomplete="off" />
        <input type="hidden" name="pickup_lat" /><input type="hidden" name="pickup_lng" /></div>
      <div class="form-group"><label class="form-label">Drop-off</label>
        <select class="form-input" name="dropoff"></select>
        <input class="form-input" name="dropoff_text" placeholder="…or start typing an address" style="margin-top:6px" autocomplete="off" />
        <input type="hidden" name="dropoff_lat" /><input type="hidden" name="dropoff_lng" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Date &amp; time (blank = ASAP)</label><input class="form-input" type="datetime-local" name="when" /></div>
      <div class="form-group"><label class="form-label">Party size</label>
        <select class="form-input" name="party"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
    </div>
    <div class="toggle-row"><span class="small" style="font-weight:600">Round trip — driver waits and returns</span>
      <label class="switch"><input type="checkbox" name="round_trip"><span class="slider"></span></label></div>
    <div class="toggle-row" style="border-bottom:none"><span class="small" style="font-weight:600">Wheelchair-accessible vehicle needed</span>
      <label class="switch"><input type="checkbox" name="ada"><span class="slider"></span></label></div>
    <div class="form-group" style="margin-top:10px"><label class="form-label">Notes for dispatch (optional)</label>
      <input class="form-input" name="notes" placeholder="e.g. meeting the group at valet stand B" /></div>
    <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-paper-plane"></i> Submit request</button>
  </form>
</div>
<div id="sec-upcoming" class="section-title"><i class="fa-solid fa-calendar-day"></i> Upcoming</div>
<div id="upcoming"></div>
<div class="section-title" style="margin-top:18px"><i class="fa-solid fa-clock-rotate-left"></i> Recent</div>
<div id="past"></div>
    </div>
    <footer class="site-footer">8 Second Rides · Houston Livestock Show and Rodeo</footer>
  </div>
</div>
<button class="rider-fab" onclick="document.getElementById('request-card').scrollIntoView({behavior:'smooth',block:'start'})" aria-label="Request a ride"><i class="fa-solid fa-plus"></i></button>
<nav class="rider-tabbar">
  <button class="rider-tab active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fa-solid fa-house"></i>Home</button>
  <button class="rider-tab" onclick="document.getElementById('sec-upcoming').scrollIntoView({behavior:'smooth',block:'start'})"><i class="fa-solid fa-car"></i>Rides</button>
  <button class="rider-tab" onclick="document.getElementById('sec-live').scrollIntoView({behavior:'smooth',block:'start'})"><i class="fa-solid fa-map-location-dot"></i>Track</button>
  <button class="rider-tab" onclick="openProfileMenu()"><i class="fa-solid fa-user"></i>Profile</button>
</nav>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/push.js"></script>
<script src="/js/rides-ui.js"></script>
<script src="/js/geocode.js"></script>
<script src="/js/rider.js"></script>
</body>
</html>
