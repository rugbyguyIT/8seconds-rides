<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>8 Second Rides — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#00142f" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-bg-pipes"></div>
  <div class="auth-shell">
    <div class="auth-hero">
      <img class="auth-hero-logo" src="/login-logo.png" alt="8 Second Rides"
           onerror="this.style.display='none';document.getElementById('auth-logo-fallback').style.display='flex'" />
      <div id="auth-logo-fallback" style="display:none;align-items:center;justify-content:center">
        <div class="auth-logo-icon"><i class="fa-solid fa-truck-fast"></i></div>
      </div>
      <h1 class="auth-hero-title">8 SECOND RIDES</h1>
      <div class="auth-hero-sub">Ride Management · Rodeo Houston</div>

      <div id="login-error" class="auth-error" style="display:none"></div>

      <div class="auth-form">
        <div id="step-email">
          <form onsubmit="handleIdentify(event)">
            <input class="auth-input" type="email" id="email" placeholder="Email address" required autocomplete="email" />
            <button type="submit" class="auth-btn" id="identify-btn">Continue</button>
          </form>
        </div>

        <div id="step-otp" style="display:none">
          <div class="auth-sub" id="otp-sub">We sent a 6-digit code to your mobile number.</div>
          <form onsubmit="handleOtpVerify(event)">
            <input class="auth-input" type="text" id="otp-code" placeholder="6-digit code" required
                   inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}"
                   style="letter-spacing:0.25em;font-size:1.5rem;text-align:center" />
            <button type="submit" class="auth-btn">Verify code</button>
          </form>
          <div class="auth-footer" style="display:flex;gap:20px;justify-content:center">
            <span class="auth-link" onclick="resendOtp()">Resend code</span>
            <span class="auth-link" onclick="show('step-email')">Use a different email</span>
          </div>
        </div>

        <div id="step-password" style="display:none">
          <form onsubmit="handlePasswordLogin(event)">
            <input class="auth-input" type="password" id="password" placeholder="Password" required autocomplete="current-password" />
            <button type="submit" class="auth-btn">Sign in</button>
          </form>
          <div class="auth-footer" style="display:flex;gap:20px;justify-content:center">
            <span class="auth-link" onclick="show('step-email')">Use a different email</span>
          </div>
        </div>
      </div>

      <a href="/pages/kiosk.html" target="_blank" rel="noopener" class="auth-kiosk-link">
        <i class="fa-solid fa-tv"></i> Open Command Center kiosk <i class="fa-solid fa-up-right-from-square" style="font-size:11px"></i>
      </a>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/pipes-bg.js"></script>
</body>
</html>
