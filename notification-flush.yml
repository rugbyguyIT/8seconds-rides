# Delivers queued push/SMS notifications every 5 minutes.
# SWA managed functions can't run timer triggers, so — like 8 Seconds'
# nightly-reminders — a GitHub Actions cron hits the flush endpoint.
# (Ride actions also flush immediately in-process; this sweeps retries
# and anything a crashed request left behind.)
# Required repo secrets: APP_URL (https://<your-swa>.azurestaticapps.net), FLUSH_SECRET
name: Notification outbox flush
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/notifications/flush
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/notifications/flush" \
            -H "x-flush-secret: ${{ secrets.FLUSH_SECRET }}" \
            -H "Content-Type: application/json" --max-time 60
