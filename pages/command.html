<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8 Second Rides — Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#040b16" />
</head>
<body>
<div class="cmd-wrap">
  <div class="cmd-top">
    <div class="cmd-title">8 SECOND <span>RIDES</span> <span style="color:rgba(255,255,255,0.4);font-weight:400;font-size:14px;letter-spacing:.08em;margin-left:6px">COMMAND CENTER</span></div>
    <div id="cmd-links" style="display:flex;align-items:center;gap:10px;margin-left:22px"></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:16px">
      <div style="text-align:right">
        <div class="cmd-clock" id="cmd-clock">--:--:--</div>
        <div class="cmd-date" id="cmd-date">—</div>
      </div>
      <button class="btn btn-sm" onclick="kioskSignOut()" style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.18);color:#fff"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </div>
  <div class="cmd-stats">
    <div class="cmd-stat hot"><div class="n" id="cs-live">–</div><div class="l">Rides in motion</div></div>
    <div class="cmd-stat"><div class="n" id="cs-pending">–</div><div class="l">Awaiting approval</div></div>
    <div class="cmd-stat"><div class="n" id="cs-vehicles">–</div><div class="l">Vehicles reporting</div></div>
    <div class="cmd-stat"><div class="n" id="cs-idle">–</div><div class="l">Vehicles idle</div></div>
  </div>
  <div class="cmd-main">
    <div class="cmd-map">
      <div id="cmd-map-controls" class="cmd-map-controls">
        <button class="btn btn-sm cmd-map-btn" onclick="recenterMap()"><i class="fa-solid fa-crosshairs"></i> Recenter</button>
        <button class="btn btn-sm cmd-map-btn" onclick="zoomToCity()"><i class="fa-solid fa-city"></i> Zoom to city</button>
      </div>
      <div id="cmd-map-real" style="display:none;height:100%;border-radius:var(--r2);overflow:hidden"></div>
      <div id="cmd-map-fallback" class="map-wrap" style="height:100%">
        <svg id="cmd-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">
          <!-- Stylized reference grid — not a literal street map. Real-time
               vehicle positions below are the accurate, data-driven part. -->
          <line x1="0" y1="60" x2="1000" y2="60" class="map-road" stroke-width="8"/>
          <line x1="0" y1="160" x2="1000" y2="160" class="map-road" stroke-width="8"/>
          <line x1="0" y1="260" x2="1000" y2="260" class="map-road" stroke-width="8"/>
          <line x1="0" y1="360" x2="1000" y2="360" class="map-road" stroke-width="8"/>
          <line x1="0" y1="460" x2="1000" y2="460" class="map-road" stroke-width="8"/>
          <line x1="0" y1="555" x2="1000" y2="555" class="map-road" stroke-width="8"/>
          <line x1="90" y1="0" x2="90" y2="600" class="map-road" stroke-width="8"/>
          <line x1="220" y1="0" x2="220" y2="600" class="map-road" stroke-width="8"/>
          <line x1="365" y1="0" x2="365" y2="600" class="map-road" stroke-width="8"/>
          <line x1="640" y1="0" x2="640" y2="600" class="map-road" stroke-width="8"/>
          <line x1="785" y1="0" x2="785" y2="600" class="map-road" stroke-width="8"/>
          <line x1="920" y1="0" x2="920" y2="600" class="map-road" stroke-width="8"/>
          <line x1="0" y1="595" x2="1000" y2="70" class="map-road map-road-major" stroke-width="14"/>

          <rect x="120" y="18" width="60" height="30" class="map-bldg"/>
          <rect x="250" y="85" width="55" height="42" class="map-bldg"/>
          <rect x="420" y="25" width="70" height="22" class="map-bldg"/>
          <rect x="680" y="95" width="42" height="55" class="map-bldg"/>
          <rect x="820" y="35" width="55" height="32" class="map-bldg"/>
          <rect x="150" y="185" width="50" height="55" class="map-bldg"/>
          <rect x="450" y="195" width="80" height="40" class="map-bldg"/>
          <rect x="850" y="180" width="50" height="60" class="map-bldg"/>
          <rect x="120" y="290" width="60" height="42" class="map-bldg"/>
          <rect x="800" y="285" width="65" height="45" class="map-bldg"/>
          <rect x="140" y="405" width="55" height="35" class="map-bldg"/>
          <rect x="850" y="415" width="45" height="55" class="map-bldg"/>
          <rect x="270" y="470" width="45" height="30" class="map-bldg"/>

          <rect x="390" y="370" width="220" height="160" rx="8" class="map-lot"/>
          <ellipse cx="500" cy="450" rx="80" ry="55" class="map-bldg" style="fill:#122540"/>
          <circle cx="500" cy="450" r="6" class="pin-pickup"/>
          <text x="500" y="345" text-anchor="middle" class="map-label">NRG STADIUM</text>
          <text x="420" y="510" text-anchor="middle" class="map-label-sm">SOUTH LOT</text>
          <text x="580" y="400" text-anchor="middle" class="map-label-sm">NORTH LOT</text>
          <text x="60" y="105" text-anchor="middle" class="map-label-sm">MAIN GATE</text>
          <text x="940" y="130" text-anchor="middle" class="map-label-sm">VIP ENTRANCE</text>

          <g id="veh-layer"></g>
        </svg>
      </div>
    </div>
    <div class="cmd-rail" id="cmd-rail">
      <div class="rail-hdr">Live rides</div>
      <div class="small muted" style="padding:8px">Loading…</div>
    </div>
  </div>
</div>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/push.js"></script>
<script src="/js/rides-ui.js"></script>
<script src="/js/livemap.js"></script>
<script src="/js/command.js"></script>
</body>
</html>
