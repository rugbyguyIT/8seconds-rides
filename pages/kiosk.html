<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>8 Second Rides — Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#040b16" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
<div class="kiosk-wrap">
  <div class="kiosk-card">
    <div class="kiosk-title">8 SECOND <span>RIDES</span></div>
    <div class="kiosk-sub">Command Center — enter PIN</div>
    <div class="kiosk-dots" id="kiosk-dots"></div>
    <div id="kiosk-error" class="kiosk-error" style="display:none"></div>
    <div class="kiosk-pad" id="kiosk-pad"></div>
    <div class="kiosk-actions">
      <button class="btn" onclick="kioskClear()"><i class="fa-solid fa-delete-left"></i> Clear</button>
      <button class="btn btn-primary" onclick="kioskSubmit()"><i class="fa-solid fa-right-to-bracket"></i> Enter</button>
    </div>
    <div class="kiosk-footer"><a href="/index.html">Sign in with email instead</a></div>
  </div>
</div>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/kiosk.js"></script>
</body>
</html>
